name: LUNA Failure-Driven Search v1
# luna-search-v1 trigger: full family inference + quality gate + fresh-seed replication

on:
  push:
    branches: [master]
    paths:
      - scripts/research/build_factor_dataset.py
      - scripts/research/download_mendeley_set.py
      - scripts/research/filter_last_5y.py
      - scripts/research/build_monthly_factor_dataset_v4.py
      - scripts/research/luna_failure_driven_search_v1.py
      - scripts/research/luna_research_scorecard_v1.py
      - scripts/research/luna_neutralized_alpha_crowding_v1.py
      - scripts/research/luna_model_registry_v1.py
      - scripts/research/luna_research_quality_gate_v2.py
      - scripts/research/luna_dependent_data_multiple_testing_v1.py
      - scripts/research/luna_fresh_seed_replication_v1.py
      - scripts/research/luna_universe_robustness_v1.py
      - scripts/research/luna_sector_industry_neutralization_v1.py
      - scripts/research/luna_symbol_lifecycle_diagnostic_v1.py
      - research-results/luna-m1-benchmark-locked-20260920.csv

concurrency:
  group: luna-failure-driven-search-v1
  cancel-in-progress: false

jobs:
  search:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'luna-search-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip pandas numpy python-dateutil

      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2 "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1" -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip

      - name: Normalize SET history
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py --zip data/raw/gybmm9t3mr-1.zip --output-dir data/set_2000_2025 --quarantine-invalid --max-invalid-rate 0.01

      - name: Build daily factors
        run: |
          python scripts/research/build_factor_dataset.py --prices data/set_2000_2025/prices.csv --output data/set_2000_2025/factors.csv

      - name: Filter trailing five years
        run: |
          python scripts/research/filter_last_5y.py --input data/set_2000_2025/factors.csv --output data/set_2000_2025/factors_5y.csv
          test -s data/set_2000_2025/factors_5y.csv

      - name: Build monthly panel
        run: |
          python scripts/research/build_monthly_factor_dataset_v4.py --input data/set_2000_2025/factors_5y.csv --output data/set_2000_2025/monthly_factors_5y_v4.csv
          test -s data/set_2000_2025/monthly_factors_5y_v4.csv

      - name: Run failure-driven search
        run: |
          rm -rf research/luna_failure_driven_search_v1
          python scripts/research/luna_failure_driven_search_v1.py             --input data/set_2000_2025/monthly_factors_5y_v4.csv             --benchmark research-results/luna-m1-benchmark-locked-20260920.csv             --output research/luna_failure_driven_search_v1             --formula-count 5000             --seed 20260921             --k 20             --cost-bps 20             --lookback-months 24             --inner-train-months 12             --inner-valid-months 6             --outer-holdout-months 12             --min-history-months 9

      - name: Run institutional scorecard
        run: |
          rm -rf research/luna_research_scorecard_v1
          python scripts/research/luna_research_scorecard_v1.py             --input data/set_2000_2025/monthly_factors_5y_v4.csv             --search-summary research/luna_failure_driven_search_v1/summary.json             --formula-catalog research/luna_failure_driven_search_v1/formula_catalog.json             --benchmark research-results/luna-m1-benchmark-locked-20260920.csv             --output research/luna_research_scorecard_v1

      - name: Run neutralized alpha and crowding diagnostics
        run: |
          python scripts/research/luna_neutralized_alpha_crowding_v1.py             --input data/set_2000_2025/monthly_factors_5y_v4.csv             --search-summary research/luna_failure_driven_search_v1/summary.json             --formula-catalog research/luna_failure_driven_search_v1/formula_catalog.json             --benchmark research-results/luna-m1-benchmark-locked-20260920.csv             --output research/luna_research_scorecard_v1

      - name: Run universe robustness diagnostic
        run: |
          python scripts/research/luna_universe_robustness_v1.py \
            --input data/set_2000_2025/monthly_factors_5y_v4.csv \
            --search-summary research/luna_failure_driven_search_v1/summary.json \
            --formula-catalog research/luna_failure_driven_search_v1/formula_catalog.json \
            --output research/luna_research_scorecard_v1 \
            --k 20 \
            --cost-bps 20 \
            --random-replicates 20

      - name: Run sector industry neutralization diagnostic
        run: |
          python scripts/research/luna_sector_industry_neutralization_v1.py \
            --input data/set_2000_2025/monthly_factors_5y_v4.csv \
            --search-summary research/luna_failure_driven_search_v1/summary.json \
            --formula-catalog research/luna_failure_driven_search_v1/formula_catalog.json \
            --output research/luna_research_scorecard_v1 \
            --k 20 \
            --cost-bps 20

      - name: Run symbol lifecycle survivorship diagnostic
        run: |
          python scripts/research/luna_symbol_lifecycle_diagnostic_v1.py             --input data/set_2000_2025/monthly_factors_5y_v4.csv             --output research/luna_research_scorecard_v1             --min-history-months 12

      - name: Run dependent-data multiple-testing diagnostic
        run: |
          python scripts/research/luna_dependent_data_multiple_testing_v1.py \
            --return-matrix research/luna_failure_driven_search_v1/formula_return_matrix.csv.gz \
            --summary research/luna_failure_driven_search_v1/summary.json \
            --output research/luna_research_scorecard_v1/multiple-testing.json \
            --bootstrap-count 500 \
            --block-length 3 \
            --seed 20260921

      - name: Run fresh-seed replication
        run: |
          rm -rf research/luna_fresh_seed_replication_v1
          python scripts/research/luna_fresh_seed_replication_v1.py \
            --input data/set_2000_2025/monthly_factors_5y_v4.csv \
            --benchmark research-results/luna-m1-benchmark-locked-20260920.csv \
            --output research/luna_fresh_seed_replication_v1 \
            --seeds 20260922,20260923,20260924 \
            --formula-count 5000 \
            --k 20 \
            --cost-bps 20 \
            --lookback-months 24 \
            --inner-train-months 12 \
            --inner-valid-months 6 \
            --outer-holdout-months 12 \
            --min-history-months 9

      - name: Run research quality gate
        run: |
          python scripts/research/luna_research_quality_gate_v2.py \
            --summary research/luna_failure_driven_search_v1/summary.json \
            --scorecard research/luna_research_scorecard_v1/scorecard.json \
            --neutralized research/luna_research_scorecard_v1/neutralized-alpha-crowding.json \
            --replication research/luna_fresh_seed_replication_v1/replication.json \
            --output research/luna_research_scorecard_v1/promotion-gate.json

      - name: Create model registry entry
        run: |
          python scripts/research/luna_model_registry_v1.py             --search-summary research/luna_failure_driven_search_v1/summary.json             --scorecard research/luna_research_scorecard_v1/scorecard.json             --neutralized research/luna_research_scorecard_v1/neutralized-alpha-crowding.json             --multiple-testing research/luna_research_scorecard_v1/multiple-testing.json                         --universe research/luna_research_scorecard_v1/universe-robustness.json \
            --sector-neutralization research/luna_research_scorecard_v1/sector-neutralization.json \
            --lifecycle research/luna_research_scorecard_v1/symbol-lifecycle.json \
            --benchmark research-results/luna-m1-benchmark-locked-20260920.csv             --output research/luna_research_scorecard_v1/model-registry-entry.json

      - name: Validate result
        run: |
          python - <<'PY'
          import json
          p="research/luna_failure_driven_search_v1/summary.json"
          x=json.load(open(p))
          assert x["status"]=="COMPLETED"
          assert x["formula_count"]==5000
          assert x["frozen_holdout"]["months"] >= 6
          assert x["leakage_guard"]
          n=json.load(open("research/luna_research_scorecard_v1/neutralized-alpha-crowding.json"))
          assert n["status"]=="COMPLETED"
          g=json.load(open("research/luna_research_scorecard_v1/promotion-gate.json"))
          assert g["status"]=="COMPLETED"
          u=json.load(open("research/luna_research_scorecard_v1/universe-robustness.json"))
          assert u["status"]=="COMPLETED"
          si=json.load(open("research/luna_research_scorecard_v1/sector-neutralization.json"))
          assert si["status"] in {"COMPLETED","UNAVAILABLE"}
          lc=json.load(open("research/luna_research_scorecard_v1/symbol-lifecycle.json"))
          assert lc["status"]=="COMPLETED"
          mt=json.load(open("research/luna_research_scorecard_v1/multiple-testing.json"))
          assert mt["status"]=="COMPLETED"
          rep=json.load(open("research/luna_fresh_seed_replication_v1/replication.json"))
          assert rep["status"]=="COMPLETED"
          print(json.dumps({
              "search": x,
              "neutralized": n,
              "promotion_gate": g,
              "multiple_testing": mt,
              "fresh_seed_replication": rep,
          }, indent=2))
          PY

      - name: Publish result
        run: |
          rm -rf research-results/luna-failure-driven-search-v1
          mkdir -p research-results/luna-failure-driven-search-v1
          cp research/luna_failure_driven_search_v1/summary.json research-results/luna-failure-driven-search-v1/summary.json
          cp research/luna_failure_driven_search_v1/outer_oos_ledger.csv research-results/luna-failure-driven-search-v1/outer-oos-ledger.csv
          cp research/luna_failure_driven_search_v1/formula_return_matrix.csv.gz research-results/luna-failure-driven-search-v1/formula-return-matrix.csv.gz
          cp research/luna_failure_driven_search_v1/formula_catalog.json research-results/luna-failure-driven-search-v1/formula-catalog.json
          cp research/luna_failure_driven_search_v1/final_selection_board.csv research-results/luna-failure-driven-search-v1/final-selection-board.csv
          cp research/luna_failure_driven_search_v1/full_period_descriptive.csv research-results/luna-failure-driven-search-v1/full-period-descriptive.csv
          cp research/luna_research_scorecard_v1/scorecard.json research-results/luna-failure-driven-search-v1/scorecard.json
          cp research/luna_research_scorecard_v1/neutralized-alpha-crowding.json research-results/luna-failure-driven-search-v1/neutralized-alpha-crowding.json
          cp research/luna_research_scorecard_v1/model-registry-entry.json research-results/luna-failure-driven-search-v1/model-registry-entry.json
          cp research/luna_research_scorecard_v1/promotion-gate.json research-results/luna-failure-driven-search-v1/promotion-gate.json
          cp research/luna_research_scorecard_v1/multiple-testing.json research-results/luna-failure-driven-search-v1/multiple-testing.json
          cp research/luna_research_scorecard_v1/universe-robustness.json research-results/luna-failure-driven-search-v1/universe-robustness.json
          cp research/luna_research_scorecard_v1/sector-neutralization.json research-results/luna-failure-driven-search-v1/sector-neutralization.json
          cp research/luna_research_scorecard_v1/symbol-lifecycle.json research-results/luna-failure-driven-search-v1/symbol-lifecycle.json
          cp research/luna_fresh_seed_replication_v1/replication.json research-results/luna-failure-driven-search-v1/fresh-seed-replication.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-failure-driven-search-v1
          git diff --cached --quiet || git commit -m "research(luna-search-v1): publish failure-driven search result"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
