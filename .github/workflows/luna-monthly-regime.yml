name: LUNA Monthly Regime Search

on:
  workflow_dispatch:

concurrency:
  group: luna-monthly-regime
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Export current monthly factor dataset
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          rm -rf data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py             --output data/luna_monthly/monthly_price_factors.csv             --start 2021-09-01             --end 2026-08-01

      - name: Run train-dev-OOS-blind-holdout conditional search
        run: |
          rm -rf research/luna_monthly_regime
          python scripts/research/monthly_regime_search.py             --input data/luna_monthly/monthly_price_factors.csv             --output research/luna_monthly_regime             --train-end 2023-12-01             --dev-end 2024-12-01             --oos-end 2025-12-01             --holdout-end 2026-07-01             --cost-bps 40             --k-values 5,10,20             --weights 0.20,0.35,0.50,0.65,0.80             --regime-thresholds 0.25,0.50,0.75

      - name: Save compact result
        run: |
          cp research/luna_monthly_regime/summary.json             research-results/luna-monthly-regime-result.json

      - name: Commit compact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-monthly-regime-result.json
          git diff --cached --quiet || git commit -m "Save LUNA monthly regime research result"
          git push

      - name: Upload full research artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-monthly-regime-results
          path: |
            research/luna_monthly_regime/summary.json
            research/luna_monthly_regime/manifest.json
            research/luna_monthly_regime/candidate_results.csv
            research/luna_monthly_regime/conditional_pairs.csv
          compression-level: 0
          retention-days: 14
