name: LUNA Adaptive Tournament v2

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_adaptive_tournament_v2.py"
      - ".github/workflows/luna-adaptive-tournament-v2.yml"

concurrency:
  group: luna-adaptive-tournament-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -U pip pandas numpy requests
      - name: Export data
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py             --output data/luna_monthly/monthly_price_factors.csv             --start 2021-09-01 --end 2026-08-01
      - name: Run 1000-formula tournament
        run: |
          rm -rf research/luna_adaptive_tournament_v2
          python scripts/research/luna_adaptive_tournament_v2.py             --input data/luna_monthly/monthly_price_factors.csv             --output research/luna_adaptive_tournament_v2             --formula-count 1000 --lookback-months 24             --min-history-months 12 --cost-bps 20 --k 20
      - name: Validate
        run: |
          test -s research/luna_adaptive_tournament_v2/summary.json
          test -s research/luna_adaptive_tournament_v2/tournament_selection_ledger.csv
          python - <<'PY'
          import json
          x=json.load(open("research/luna_adaptive_tournament_v2/summary.json"))
          assert x["leakage_guard"]
          assert x["formula_count"] == 1000
          assert x["months_traded"] >= 40
          print(json.dumps(x,indent=2))
          PY
      - name: Commit result
        run: |
          mkdir -p research-results/luna-adaptive-tournament-v2
          cp research/luna_adaptive_tournament_v2/summary.json research-results/luna-adaptive-tournament-v2-summary.json
          cp research/luna_adaptive_tournament_v2/tournament_selection_ledger.csv research-results/luna-adaptive-tournament-v2/selection-ledger.csv
          cp research/luna_adaptive_tournament_v2/formula_catalog.json research-results/luna-adaptive-tournament-v2/formula-catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save adaptive tournament v2 result"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-adaptive-tournament-v2
          path: research/luna_adaptive_tournament_v2/
          retention-days: 14
