name: LUNA Adaptive Tournament v2
# Manual-only: research execution requires an explicitly verified PIT dataset/provenance.

on:
  workflow_dispatch:
    inputs:
      pit_membership_url:
        description: "PIT membership CSV URL"
        required: true
        type: string
      pit_membership_sha256:
        description: "SHA-256 of PIT membership CSV"
        required: true
        type: string
      pit_membership_manifest_url:
        description: "PIT membership provenance manifest JSON URL"
        required: true
        type: string
      pit_membership_manifest_sha256:
        description: "SHA-256 of PIT membership provenance manifest"
        required: true
        type: string
concurrency:
  group: luna-adaptive-tournament-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify PIT membership provenance
        env:
          PIT_URL: ${{ inputs.pit_membership_url }}
          PIT_SHA: ${{ inputs.pit_membership_sha256 }}
          MANIFEST_URL: ${{ inputs.pit_membership_manifest_url }}
          MANIFEST_SHA: ${{ inputs.pit_membership_manifest_sha256 }}
        run: |
          mkdir -p data/raw/pit
          curl -fL --retry 3 --retry-delay 2 "$PIT_URL" -o data/raw/pit/pit_membership.csv
          curl -fL --retry 3 --retry-delay 2 "$MANIFEST_URL" -o data/raw/pit/pit_membership.manifest.json
          test "$(sha256sum data/raw/pit/pit_membership.csv | awk '{print $1}')" = "$PIT_SHA"
          test "$(sha256sum data/raw/pit/pit_membership.manifest.json | awk '{print $1}')" = "$MANIFEST_SHA"
          python scripts/research/verify_pit_membership_manifest.py             --membership data/raw/pit/pit_membership.csv             --manifest data/raw/pit/pit_membership.manifest.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -U pip pandas numpy python-dateutil

      - name: Download public historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip

      - name: Normalize historical SET data
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025             --quarantine-invalid             --max-invalid-rate 0.01

      - name: Build daily point-in-time factors
        run: |
          python scripts/research/build_factor_dataset.py             --prices data/set_2000_2025/prices.csv             --output data/set_2000_2025/factors.csv

      - name: Build monthly point-in-time research factors
        run: |
          rm -rf data/luna_monthly
          mkdir -p data/luna_monthly
          python scripts/research/build_monthly_luna_factors_from_daily.py             --input data/set_2000_2025/factors.csv             --output data/luna_monthly/monthly_price_factors.csv             --lookback-years 5             --membership data/raw/pit/pit_membership.csv
          test -s data/luna_monthly/monthly_price_factors.csv
          test -s data/luna_monthly/monthly_price_factors.manifest.json

      - name: Run 1000-formula adaptive tournament
        run: |
          rm -rf research/luna_adaptive_tournament_v2
          python scripts/research/luna_adaptive_tournament_v2.py             --input data/luna_monthly/monthly_price_factors.csv             --output research/luna_adaptive_tournament_v2             --formula-count 1000             --lookback-months 24             --min-history-months 12             --cost-bps 20             --k 20

      - name: Validate
        run: |
          test -s research/luna_adaptive_tournament_v2/summary.json
          test -s research/luna_adaptive_tournament_v2/tournament_selection_ledger.csv
          test -s research/luna_adaptive_tournament_v2/formula_catalog.json
          python - <<'PY'
          import json
          x=json.load(open("research/luna_adaptive_tournament_v2/summary.json"))
          m=json.load(open("data/luna_monthly/monthly_price_factors.manifest.json"))
          assert x["leakage_guard"]
          assert x["formula_count"] == 1000
          assert x["months_traded"] >= 40
          assert m["no_forward_data_in_factors"] is True
          print(json.dumps({"summary": x, "monthly_manifest": m}, indent=2))
          PY

      - name: Commit result
        run: |
          mkdir -p research-results/luna-adaptive-tournament-v2
          cp research/luna_adaptive_tournament_v2/summary.json             research-results/luna-adaptive-tournament-v2-summary.json
          cp research/luna_adaptive_tournament_v2/tournament_selection_ledger.csv             research-results/luna-adaptive-tournament-v2/selection-ledger.csv
          cp research/luna_adaptive_tournament_v2/formula_catalog.json             research-results/luna-adaptive-tournament-v2/formula-catalog.json
          cp data/luna_monthly/monthly_price_factors.manifest.json             research-results/luna-adaptive-tournament-v2-monthly-data-manifest.json
          cp data/set_2000_2025/manifest.json             research-results/luna-adaptive-tournament-v2-source-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save adaptive tournament v2 public-data result"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-adaptive-tournament-v2
          path: |
            research/luna_adaptive_tournament_v2/
            data/luna_monthly/monthly_price_factors.manifest.json
            data/set_2000_2025/manifest.json
          retention-days: 14
