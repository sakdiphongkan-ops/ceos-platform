name: LUNA 2.0 CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - luna2-foundation-blueprint-v1

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
