name: LUNA Research Data Quality CI

on:
  push:
    branches: [research/autonomous-paper-bot-20261112]
    paths:
      - "scripts/research/build_monthly_factors_from_daily.py"
      - "scripts/research/export_supabase_daily_prices.py"
      - "tests/research/test_build_monthly_factors_from_daily.py"
      - "supabase/migrations/20261112070000_luna_research_pit_availability_v1.sql"
      - "supabase/functions/luna-daily-ingest/index.ts"
      - "supabase/functions/luna-toptrader-ws-ingest/index.ts"
      - "supabase/functions/luna-toptrader-ws-ingest/coverage-diagnostics.ts"
      - ".github/workflows/luna-research-data-quality-ci.yml"
  pull_request:
    paths:
      - "scripts/research/build_monthly_factors_from_daily.py"
      - "scripts/research/export_supabase_daily_prices.py"
      - "tests/research/test_build_monthly_factors_from_daily.py"
      - "supabase/migrations/20261112070000_luna_research_pit_availability_v1.sql"
      - "supabase/functions/luna-daily-ingest/index.ts"

jobs:
  pit-data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy
      - run: python tests/research/test_build_monthly_factors_from_daily.py
      - uses: denoland/setup-deno@v2
      - run: deno check --node-modules-dir=auto supabase/functions/luna-daily-ingest/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/luna-toptrader-ws-ingest/index.ts
