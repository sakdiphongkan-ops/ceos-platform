name: LUNA-TH1H CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      pit_membership_url:
        description: "Auditable point-in-time membership CSV URL (symbol,start_date,end_date)"
        required: true
        type: string

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luna-th1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: luna-th1h/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:market-session
      - run: npm run test:strategy-state
      - run: npm run test:execution-reservations
      - run: npm run test:risk-guards
      - run: npm run test:cost-replay
      - run: npm run test:execution-scheduler
      - run: npm run test:live-reconciliation
      - run: npm run test:telemetry-queue
      - run: npm run test:latency
      - run: npm run test:latency-ledger
      - run: npm run test:research-preflight
      - run: npm run test:pit-universe
      - run: npm run backtest:fixture
      - name: Compile execution gateway and SET data QA tools
        run: |
          python -m py_compile ../luna-execution-gateway/app.py
          python -m py_compile ../scripts/research/normalize_set_tick_data.py
          python -m py_compile ../scripts/research/qa_verified_15m.py
          python -m py_compile ../scripts/research/apply_pit_universe.py
          python -m py_compile ../scripts/research/monthly_walk_forward_adaptive_search.py
          python -m py_compile ../scripts/research/luna_adaptive_tournament_v2.py
          cd ../scripts/research && python test_apply_pit_universe.py
          python test_set_data_contract.py

  research_repaired_tournament_v3:
    if: github.event_name == 'workflow_dispatch' && inputs.pit_membership_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changed
        name: Enable manual PIT research run
        run: echo "run=true" >> "$GITHUB_OUTPUT"      - name: Setup Python
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        if: steps.changed.outputs.run == 'true'
        run: python -m pip install -U pip pandas numpy python-dateutil
      - name: Download historical SET dataset
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2 "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1" -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip
      - name: Download PIT universe membership
        if: steps.changed.outputs.run == 'true'
        env:
          PIT_MEMBERSHIP_URL: ${{ inputs.pit_membership_url }}
        run: |
          curl -fL --retry 3 --retry-delay 2 "$PIT_MEMBERSHIP_URL" -o data/raw/pit_membership.csv
          test -s data/raw/pit_membership.csv
          head -n 1 data/raw/pit_membership.csv
      - name: Normalize SET history
        if: steps.changed.outputs.run == 'true'
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py --zip data/raw/gybmm9t3mr-1.zip --output-dir data/set_2000_2025 --quarantine-invalid --max-invalid-rate 0.01
      - name: Build daily factors
        if: steps.changed.outputs.run == 'true'
        run: |
          python scripts/research/build_factor_dataset.py --prices data/set_2000_2025/prices.csv --output data/set_2000_2025/factors.csv
      - name: Build trailing five-year daily panel
        if: steps.changed.outputs.run == 'true'
        run: |
          python scripts/research/filter_last_5y.py --input data/set_2000_2025/factors.csv --output data/set_2000_2025/factors_5y.csv
      - name: Build monthly panel
        if: steps.changed.outputs.run == 'true'
        run: |
          python scripts/research/build_monthly_factor_dataset.py \
            --input data/set_2000_2025/factors_5y.csv \
            --output data/set_2000_2025/monthly_factors_5y.csv \
            --membership data/raw/pit_membership.csv
          test -s data/set_2000_2025/monthly_factors_5y.csv
      - name: Run repaired 1000-formula tournament
        if: steps.changed.outputs.run == 'true'
        run: |
          rm -rf research/luna_adaptive_tournament_v3
          python scripts/research/luna_adaptive_tournament_v3.py \
            --input data/set_2000_2025/monthly_factors_5y.csv \
            --output research/luna_adaptive_tournament_v3 \
            --membership data/raw/pit_membership.csv \
            --formula-count 1000 --seed 20260920 --lookback-months 24 \
            --min-history-months 12 --cost-bps 20 --k 20
      - name: Validate research result
        if: steps.changed.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          p="research/luna_adaptive_tournament_v3/summary.json"
          x=json.load(open(p))
          assert x["status"] == "COMPLETED"
          assert x["formula_count"] == 1000
          assert x["months_traded"] >= 24
          assert x["leakage_guard"]
          assert x["benchmark_m1_rev21_k20"]
          assert x["pit_universe_required"] is True
          assert x["pit_membership"]
          print(json.dumps(x, indent=2))
          PY
      - name: Save repaired research result
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p research-results/luna-adaptive-tournament-v3-rerun
          cp research/luna_adaptive_tournament_v3/summary.json research-results/luna-adaptive-tournament-v3-rerun-summary.json
          cp research/luna_adaptive_tournament_v3/tournament_selection_ledger.csv research-results/luna-adaptive-tournament-v3-rerun/selection-ledger.csv
          cp research/luna_adaptive_tournament_v3/formula_catalog.json research-results/luna-adaptive-tournament-v3-rerun/formula-catalog.json
          cp research/luna_adaptive_tournament_v3/full_period_formula_stats.csv research-results/luna-adaptive-tournament-v3-rerun/full-period-formula-stats.csv
          cp data/set_2000_2025/monthly_factors_5y.csv.manifest.json research-results/luna-adaptive-tournament-v3-rerun-data-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save repaired public tournament v3 rerun"
          git push
