name: LUNA research edge function CI

on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/functions/luna-research/**"
      - ".github/workflows/luna-research-edge-ci.yml"
  push:
    branches: [master]
    paths:
      - "supabase/functions/luna-research/**"
      - ".github/workflows/luna-research-edge-ci.yml"

permissions:
  contents: read

jobs:
  typecheck-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check research edge function and helpers
        run: deno check supabase/functions/luna-research/index.ts supabase/functions/luna-research/research_get_helpers_test.ts
      - name: Run bounded pagination and run-state tests
        run: deno test supabase/functions/luna-research/research_get_helpers_test.ts
