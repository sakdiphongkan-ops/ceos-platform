name: LUNA Theory Family Search v1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_theory_family_search_v1.py"
      - "scripts/research/build_factor_dataset.py"
      - ".github/workflows/luna-theory-family-search-v1.yml"

concurrency:
  group: luna-theory-family-search-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip pandas numpy python-dateutil

      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip

      - name: Normalize SET history
        run: |
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025             --quarantine-invalid             --max-invalid-rate 0.01

      - name: Build canonical factor dataset
        run: |
          python scripts/research/build_factor_dataset.py             --prices data/set_2000_2025/prices.csv             --output data/set_2000_2025/factors.csv

      - name: Restrict to trailing 5 years
        run: |
          python scripts/research/filter_last_5y.py             --input data/set_2000_2025/factors.csv             --output data/set_2000_2025/factors_5y.csv

      - name: Run controlled theory-family search
        run: |
          rm -rf research/luna_theory_family_search_v1
          python scripts/research/luna_theory_family_search_v1.py             --input data/set_2000_2025/factors_5y.csv             --output research/luna_theory_family_search_v1             --k 20             --cost-bps 20             --holdout-months 12             --top-n 25

          test -s research/luna_theory_family_search_v1/summary.json
          test -s research/luna_theory_family_search_v1/validation_ranking.csv
          test -s research/luna_theory_family_search_v1/frozen_oos_holdout.csv
          test -s research/luna_theory_family_search_v1/holdout_stress.csv

      - name: Save result
        run: |
          mkdir -p research-results/luna-theory-family-search-v1
          cp research/luna_theory_family_search_v1/summary.json research-results/luna-theory-family-search-v1/summary.json
          cp research/luna_theory_family_search_v1/formula_catalog.json research-results/luna-theory-family-search-v1/formula_catalog.json
          cp research/luna_theory_family_search_v1/validation_ranking.csv research-results/luna-theory-family-search-v1/validation_ranking.csv
          cp research/luna_theory_family_search_v1/frozen_oos_holdout.csv research-results/luna-theory-family-search-v1/frozen_oos_holdout.csv
          cp research/luna_theory_family_search_v1/holdout_stress.csv research-results/luna-theory-family-search-v1/holdout_stress.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-theory-family-search-v1
          git diff --cached --quiet || git commit -m "research(luna): save theory family search result"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-theory-family-search-v1
          path: research/luna_theory_family_search_v1/
          retention-days: 14
