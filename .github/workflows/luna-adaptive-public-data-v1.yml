name: LUNA Adaptive Tournament v2 - Public SET Data

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/research/build_monthly_price_factors_from_daily.py"
      - "scripts/research/luna_adaptive_tournament_v2.py"
      - "scripts/research/luna_holdout_audit_v1.py"
      - ".github/workflows/luna-adaptive-public-data-v1.yml"

concurrency:
  group: luna-adaptive-public-data-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy python-dateutil

      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip

      - name: Normalize daily SET prices
        run: |
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025             --quarantine-invalid             --max-invalid-rate 0.01

      - name: Build canonical daily factor dataset
        run: |
          python scripts/research/build_factor_dataset.py             --prices data/set_2000_2025/prices.csv             --output data/set_2000_2025/factors.csv

      - name: Build monthly factor dataset
        run: |
          rm -rf data/luna_monthly_public
          python scripts/research/build_monthly_price_factors_from_daily.py             --input data/set_2000_2025/factors.csv             --output data/luna_monthly_public/monthly_price_factors_all.csv

      - name: Restrict monthly research window to trailing 5 years
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          src = Path("data/luna_monthly_public/monthly_price_factors_all.csv")
          out = Path("data/luna_monthly_public/monthly_price_factors.csv")
          df = pd.read_csv(src)
          df["month_end"] = pd.to_datetime(df["month_end"], errors="raise")
          end = df["month_end"].max()
          start = end - pd.DateOffset(years=5)
          x = df[df["month_end"] >= start].copy()
          x = x.sort_values(["month_end","symbol"]).reset_index(drop=True)
          out.parent.mkdir(parents=True, exist_ok=True)
          x.to_csv(out, index=False)
          print({
              "rows": len(x),
              "symbols": int(x["symbol"].nunique()),
              "months": int(x["month_end"].nunique()),
              "start": str(x["month_end"].min().date()),
              "end": str(x["month_end"].max().date()),
          })
          PY

      - name: Run 1000-formula adaptive tournament
        run: |
          rm -rf research/luna_adaptive_tournament_v2_public
          python scripts/research/luna_adaptive_tournament_v2.py             --input data/luna_monthly_public/monthly_price_factors.csv             --output research/luna_adaptive_tournament_v2_public             --formula-count 1000             --lookback-months 24             --min-history-months 12             --cost-bps 20             --k 20

      - name: Run frozen 12-month holdout audit
        run: |
          rm -rf research/luna_holdout_audit_v1_public
          python scripts/research/luna_holdout_audit_v1.py             --input data/luna_monthly_public/monthly_price_factors.csv             --catalog research/luna_adaptive_tournament_v2_public/formula_catalog.json             --output research/luna_holdout_audit_v1_public             --holdout-months 12             --top-n 25             --k 20             --cost-bps 20

      - name: Validate research outputs
        run: |
          test -s research/luna_adaptive_tournament_v2_public/summary.json
          test -s research/luna_adaptive_tournament_v2_public/tournament_selection_ledger.csv
          test -s research/luna_adaptive_tournament_v2_public/formula_catalog.json
          test -s research/luna_holdout_audit_v1_public/summary.json
          test -s research/luna_holdout_audit_v1_public/holdout_ranked.csv

          python - <<'PY'
          import json
          a=json.load(open("research/luna_adaptive_tournament_v2_public/summary.json"))
          h=json.load(open("research/luna_holdout_audit_v1_public/summary.json"))
          assert a["leakage_guard"]
          assert a["formula_count"] == 1000
          assert a["months_traded"] >= 24
          assert h["selection_guard"]
          assert h["holdout_months"] == 12
          print("LUNA PUBLIC TOURNAMENT + HOLDOUT: PASS")
          print(json.dumps({"tournament": a, "holdout": h}, indent=2))
          PY

      - name: Save compact results
        run: |
          mkdir -p research-results/luna-adaptive-public-v1
          cp research/luna_adaptive_tournament_v2_public/summary.json             research-results/luna-adaptive-public-v1/tournament-summary.json
          cp research/luna_adaptive_tournament_v2_public/tournament_selection_ledger.csv             research-results/luna-adaptive-public-v1/selection-ledger.csv
          cp research/luna_adaptive_tournament_v2_public/formula_catalog.json             research-results/luna-adaptive-public-v1/formula-catalog.json
          cp research/luna_holdout_audit_v1_public/summary.json             research-results/luna-adaptive-public-v1/holdout-summary.json
          cp research/luna_holdout_audit_v1_public/holdout_ranked.csv             research-results/luna-adaptive-public-v1/holdout-ranked.csv
          cp data/luna_monthly_public/monthly_price_factors.manifest.json             research-results/luna-adaptive-public-v1/monthly-factor-manifest.json || true

      - name: Commit compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-adaptive-public-v1
          git diff --cached --quiet || git commit -m "research(luna): save public-data adaptive tournament and holdout"
          git push

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-adaptive-public-v1
          path: |
            data/set_2000_2025/manifest.json
            data/set_2000_2025/factors.manifest.json
            data/luna_monthly_public/monthly_price_factors.manifest.json
            research/luna_adaptive_tournament_v2_public/
            research/luna_holdout_audit_v1_public/
          retention-days: 14
