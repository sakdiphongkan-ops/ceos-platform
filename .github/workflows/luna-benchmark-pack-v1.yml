name: LUNA Benchmark Pack v1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_benchmark_pack_v1.py"
      - "scripts/research/export_supabase_monthly_factors.py"
      - ".github/workflows/luna-benchmark-pack-v1.yml"

concurrency:
  group: luna-benchmark-pack-v1
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -U pip pandas numpy requests
      - name: Export monthly factors
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py             --output data/luna_monthly/monthly_price_factors.csv             --start 2021-09-01             --end 2026-08-01
      - name: Run benchmark pack
        run: |
          rm -rf research/luna_benchmark_pack_v1
          python scripts/research/luna_benchmark_pack_v1.py             --input data/luna_monthly/monthly_price_factors.csv             --output research/luna_benchmark_pack_v1             --k 20             --cost-bps 0,20,50
      - name: Validate
        run: |
          test -s research/luna_benchmark_pack_v1/summary.json
          test -s research/luna_benchmark_pack_v1/candidate-results.csv
      - name: Save result
        run: |
          mkdir -p research-results/luna-benchmark-pack-v1
          cp research/luna_benchmark_pack_v1/summary.json research-results/luna-benchmark-pack-v1-summary.json
          cp research/luna_benchmark_pack_v1/candidate-results.csv research-results/luna-benchmark-pack-v1/candidate-results.csv
          cp research/luna_benchmark_pack_v1/candidate-monthly.csv research-results/luna-benchmark-pack-v1/candidate-monthly.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-benchmark-pack-v1-summary.json research-results/luna-benchmark-pack-v1/
          git diff --cached --quiet || git commit -m "research(luna): save benchmark pack result"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-benchmark-pack-v1
          path: research/luna_benchmark_pack_v1/
          retention-days: 14
