name: LUNA Frozen Holdout v2

on:
  workflow_dispatch:

concurrency:
  group: luna-frozen-holdout-v2
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Block repeated holdout exposure
        run: |
          python scripts/research/guard_holdout_once.py --marker research-results/luna-holdout-audit-v1-sealed.json --result research-results/luna-holdout-audit-v1-summary.json --protocol LUNA-HOLDOUT-AUDIT-V1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy python-dateutil
      - name: Verify tournament catalog exists
        run: test -s research-results/luna-adaptive-tournament-v3/formula-catalog.json
      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2 "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1" -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip
      - name: Normalize and build daily factors
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py --zip data/raw/gybmm9t3mr-1.zip --output-dir data/set_2000_2025 --quarantine-invalid --max-invalid-rate 0.01
          python scripts/research/build_factor_dataset.py --prices data/set_2000_2025/prices.csv --output data/set_2000_2025/factors.csv
      - name: Build five-year monthly panel
        run: |
          python scripts/research/filter_last_5y.py --input data/set_2000_2025/factors.csv --output data/set_2000_2025/factors_5y.csv
          python scripts/research/build_monthly_factor_dataset.py --input data/set_2000_2025/factors_5y.csv --output data/set_2000_2025/monthly_factors_5y.csv
      - name: Run frozen holdout
        run: |
          rm -rf research/luna_frozen_holdout_v2
          python scripts/research/luna_frozen_holdout_v2.py --input data/set_2000_2025/monthly_factors_5y.csv --catalog research-results/luna-adaptive-tournament-v3/formula-catalog.json --output research/luna_frozen_holdout_v2 --holdout-months 12 --lookback-months 24 --top-n 25 --k 20 --cost-bps 20 --stress-bps 0,20,45,60
      - name: Validate
        run: |
          test -s research/luna_frozen_holdout_v2/summary.json
          test -s research/luna_frozen_holdout_v2/holdout_ranked.csv
      - name: Save results
        run: |
          mkdir -p research-results/luna-frozen-holdout-v2
          cp research/luna_frozen_holdout_v2/summary.json research-results/luna-frozen-holdout-v2-summary.json
          cp research/luna_frozen_holdout_v2/holdout_ranked.csv research-results/luna-frozen-holdout-v2/holdout-ranked.csv
          python scripts/research/guard_holdout_once.py --marker research-results/luna-frozen-holdout-v2-sealed.json --result research-results/luna-frozen-holdout-v2-summary.json --protocol LUNA-FROZEN-HOLDOUT-V2 --mode seal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-frozen-holdout-v2-summary.json research-results/luna-frozen-holdout-v2
          git diff --cached --quiet || git commit -m "research(luna): save frozen holdout v2 result"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-frozen-holdout-v2
          path: research/luna_frozen_holdout_v2/
          retention-days: 14