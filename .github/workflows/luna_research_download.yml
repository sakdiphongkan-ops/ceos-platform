name: LUNA Research Dataset Download

concurrency:
  group: luna-research-download
  cancel-in-progress: true

on:
  push:
    paths:
      - ".github/workflows/luna_research_download.yml"
      - "scripts/research/download_mendeley_set.py"
      - "scripts/research/build_factor_dataset.py"
      - "scripts/one_million_search.py"
      - "scripts/one_million_search_staged.py"
      - "scripts/tests/test_one_million_search_staged.py"
      - "scripts/research/qa_forward_returns.py"
  workflow_dispatch:

jobs:
  download-set-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Smoke test staged 1M engine
        run: |
          python scripts/tests/test_one_million_search_staged.py

      - name: Download Mendeley dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip
          ls -lh data/raw/gybmm9t3mr-1.zip

      - name: Inspect and normalize dataset
        run: |
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025             --quarantine-invalid             --max-invalid-rate 0.01

      - name: Build technical factor dataset
        run: |
          python scripts/research/build_factor_dataset.py             --prices data/set_2000_2025/prices.csv             --output data/set_2000_2025/factors.csv

      - name: Audit forward-return quality
        run: |
          python scripts/research/qa_forward_returns.py             --input data/set_2000_2025/factors.csv             --output research/return_qa.json             --extremes-output research/return_extremes.csv             --warn-abs-return 0.20

      - name: Staged 1M hypothesis search v2 on real SET data
        run: |
          rm -rf research/one_million_v3
          python scripts/one_million_search_staged.py             --input data/set_2000_2025/factors.csv             --output research/one_million_v2             --max-trials 1000000             --finalists 200             --screen-days 120             --development-fraction 0.60             --min-names-per-day 20             --cost-bps 45             --oos-days 20             --holdout-days 40             --purge-days 1             --min-trades 30 \
            --min-positive-fold-fraction 0.50

      - name: Upload research results artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-one-million-results
          path: |
            data/set_2000_2025/manifest.json
            data/set_2000_2025/invalid_rows.csv
            data/set_2000_2025/factors.manifest.json
            research/return_qa.json
            research/return_extremes.csv
            research/one_million_v3/screen_ledger.jsonl.gz
            research/one_million_v3/screen_top.csv
            research/one_million_v3/results.csv
            research/one_million_v3/passed.csv
            research/one_million_v3/manifest.json
          compression-level: 0
          retention-days: 14
