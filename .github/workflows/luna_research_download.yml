name: LUNA Research Dataset Download

on:
  push:
    paths:
      - ".github/workflows/luna_research_download.yml"
      - "scripts/research/download_mendeley_set.py"
  workflow_dispatch:

jobs:
  download-set-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download Mendeley dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip
          ls -lh data/raw/gybmm9t3mr-1.zip

      - name: Inspect and normalize dataset
        run: |
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025

      - name: Upload research dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-set-price-dataset-2000-2025
          path: |
            data/set_2000_2025/prices.csv
            data/set_2000_2025/manifest.json
          compression-level: 0
          retention-days: 14
