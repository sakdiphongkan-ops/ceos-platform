name: LUNA M1 Liquidity PTH Theory Lab v2

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_m1_theory_liquidity_pth_v2.py"
      - ".github/workflows/luna-m1-theory-liquidity-pth-v2.yml"
      - "scripts/research/export_supabase_monthly_factors.py"
  workflow_dispatch:

concurrency:
  group: luna-m1-theory-liquidity-pth-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Export canonical monthly factor panel
        env:
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py \
            --output data/luna_monthly/monthly_price_factors.csv \
            --start 2021-09-01 \
            --end 2026-08-31

      - name: Run theory lab v2
        run: |
          rm -rf research/luna_m1_theory_liquidity_pth_v2
          python scripts/research/luna_m1_theory_liquidity_pth_v2.py \
            --input data/luna_monthly/monthly_price_factors.csv \
            --output research/luna_m1_theory_liquidity_pth_v2 \
            --k 20 \
            --costs 20,40,60

      - name: Validate research
        run: |
          test -s research/luna_m1_theory_liquidity_pth_v2/summary.json
          test -s research/luna_m1_theory_liquidity_pth_v2/candidate_results.csv
          test -s research/luna_m1_theory_liquidity_pth_v2/robust_ranking.csv
          python - <<'PY'
          import json
          x = json.load(open("research/luna_m1_theory_liquidity_pth_v2/summary.json"))
          assert x["status"] == "COMPLETED"
          assert x["candidate_count"] == 721
          assert x["k"] == 20
          assert x["selection"] == "TRAIN+DEV only; OOS/HOLDOUT frozen"
          print(json.dumps(x, indent=2))
          PY

      - name: Save compact result
        run: |
          mkdir -p research-results/luna-m1-theory-liquidity-pth-v2
          cp research/luna_m1_theory_liquidity_pth_v2/summary.json \
             research-results/luna-m1-theory-liquidity-pth-v2-summary.json
          cp research/luna_m1_theory_liquidity_pth_v2/candidate_results.csv \
             research-results/luna-m1-theory-liquidity-pth-v2/candidate-results.csv
          cp research/luna_m1_theory_liquidity_pth_v2/robust_ranking.csv \
             research-results/luna-m1-theory-liquidity-pth-v2/robust-ranking.csv
          cp research/luna_m1_theory_liquidity_pth_v2/candidate_catalog.json \
             research-results/luna-m1-theory-liquidity-pth-v2/candidate-catalog.json

      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save M1 liquidity PTH theory v2 result"
          git pull --rebase origin master
          git push

      - name: Upload full research artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-m1-theory-liquidity-pth-v2
          path: research/luna_m1_theory_liquidity_pth_v2/
          retention-days: 14
