name: LUNA gateway CI

on:
  push:
    branches: [master]
    paths:
      - "luna-execution-gateway/**"
      - ".github/workflows/luna-gateway-ci.yml"
  pull_request:
    paths:
      - "luna-execution-gateway/**"
      - ".github/workflows/luna-gateway-ci.yml"

jobs:
  gateway-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luna-execution-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gateway dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Compile and import gateway source
        run: |
          python -m py_compile app.py broker_timing.py
          python - <<'PY'
          import app
          assert app.SETTRADE_SDK_VERSION.startswith("2."), app.SETTRADE_SDK_VERSION
          print("LUNA_GATEWAY_IMPORT_OK", app.SETTRADE_SDK_VERSION)
          PY

      - name: Smoke-test provider proof policy
        env:
          LUNA_DEPLOY_SOURCE_SHA: ci
          LUNA_EXPECTED_SOURCE_SHA: ci
          LUNA_PRIMARY_MARKETDATA_PROVIDER: SETTRADE
          LUNA_MARKETDATA_PROVIDER: SETTRADE
          REALTIME_MARKETDATA_ENABLED: "true"
          SETTRADE_REALTIME_SYMBOLS: "AOT"
          SETTRADE_BROKER_ID: "broker"
          SETTRADE_APP_ID: "app"
          SETTRADE_APP_SECRET: "secret"
          SETTRADE_APP_CODE: "code"
          LUNA_LIVE_MIN_REALTIME_COVERAGE: "0.0"
        run: |
          python - <<'PY'
          import app
          app._selected_provider = "SETTRADE"
          proof = app._connectivity_proof()
          assert proof["checks"]["selected_provider_credentials_configured"] is True
          assert proof["checks"]["set_api_backup_configured"] is False
          assert proof["live_execution_ready"] is True
          print("LUNA_PROVIDER_POLICY_SMOKE_OK")
          PY

      - name: Smoke-test provider source binding
        env:
          LUNA_DEPLOY_SOURCE_SHA: ci
          LUNA_EXPECTED_SOURCE_SHA: ci
          LUNA_PRIMARY_MARKETDATA_PROVIDER: SETTRADE
          LUNA_MARKETDATA_PROVIDER: SETTRADE
          REALTIME_MARKETDATA_ENABLED: "true"
          SETTRADE_REALTIME_SYMBOLS: "AOT"
          SETTRADE_BROKER_ID: "broker"
          SETTRADE_APP_ID: "app"
          SETTRADE_APP_SECRET: "secret"
          SETTRADE_APP_CODE: "code"
          LUNA_LIVE_MIN_REALTIME_COVERAGE: "1.0"
        run: |
          python - <<'PY'
          import time
          import app
          app._selected_provider = "SETTRADE"
          app._quotes["AOT"] = {
              "symbol": "AOT",
              "source": "toptrader-public-rest",
              "_ingested_ts": time.time(),
              "bid": 10,
              "ask": 10.1,
              "bid_size": 100,
              "ask_size": 100,
          }
          proof = app._connectivity_proof()
          assert proof["coverage"]["fresh_quote_count"] == 0
          assert proof["live_execution_ready"] is False
          app._quotes["AOT"]["source"] = "settrade-price-info"
          proof = app._connectivity_proof()
          assert proof["coverage"]["fresh_quote_count"] == 1
          print("LUNA_PROVIDER_SOURCE_BINDING_OK")
          PY

      - name: Smoke-test provider switch and verified-book gate
        env:
          LUNA_DEPLOY_SOURCE_SHA: ci
          LUNA_EXPECTED_SOURCE_SHA: ci
          LUNA_PRIMARY_MARKETDATA_PROVIDER: SETTRADE
          LUNA_MARKETDATA_PROVIDER: SETTRADE
          REALTIME_MARKETDATA_ENABLED: "true"
          REALTIME_BID_OFFER_ENABLED: "true"
          SETTRADE_REALTIME_SYMBOLS: "AOT"
          SETTRADE_BROKER_ID: "broker"
          SETTRADE_APP_ID: "app"
          SETTRADE_APP_SECRET: "secret"
          SETTRADE_APP_CODE: "code"
          LUNA_LIVE_MIN_REALTIME_COVERAGE: "1.0"
        run: |
          python - <<'PY'
          import time
          import app
          app._selected_provider = "SETTRADE"
          app._quote_payload(
              symbol="AOT",
              last=10.0,
              bid=9.9,
              ask=10.1,
              bid_size=100,
              ask_size=100,
              source="toptrader-public-rest",
          )
          app._quote_payload(
              symbol="AOT",
              last=10.05,
              source="settrade-open-api-realtime",
          )
          q = app._quotes["AOT"]
          assert q["bid"] is None and q["ask"] is None
          assert q["bid_size"] is None and q["ask_size"] is None
          proof = app._connectivity_proof()
          assert proof["coverage"]["fresh_quote_count"] == 1
          assert proof["coverage"]["verified_book_count"] == 0
          assert proof["checks"]["verified_book_coverage_sufficient"] is False
          assert proof["live_execution_ready"] is False
          app._quote_payload(
              symbol="AOT",
              bid=9.9,
              ask=10.1,
              bid_size=100,
              ask_size=100,
              source="settrade-open-api-realtime",
          )
          proof = app._connectivity_proof()
          assert proof["coverage"]["verified_book_count"] == 1
          assert proof["live_execution_ready"] is True
          print("LUNA_PROVIDER_SWITCH_BOOK_GATE_OK")
          PY

      - name: Verify Settrade Open API v2 surface
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from settrade_v2 import Investor
          from settrade_v2.config import config

          print("settrade-v2", version("settrade-v2"))
          assert hasattr(Investor, "MarketData"), "Investor.MarketData missing"
          assert hasattr(Investor, "RealtimeDataConnection"), "Investor.RealtimeDataConnection missing"
          assert isinstance(config, dict), "settrade_v2.config.config must be a dict"
          print("SETTRADE_V2_SURFACE_OK")
          PY
