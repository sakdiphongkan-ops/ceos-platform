name: LUNA M1 RSI Pivot Divergence v2

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_m1_rsi_pivot_divergence_v2.py"
      - ".github/workflows/luna-m1-rsi-pivot-divergence-v2.yml"
  workflow_dispatch:

concurrency:
  group: luna-m1-rsi-pivot-divergence-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Export daily SET prices
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p data/luna_daily
          python scripts/research/export_supabase_daily_prices.py             --output data/luna_daily/daily_prices.csv             --start 2021-09-01             --end 2026-08-31             --page-size 5000

      - name: Run pivot-divergence v2
        run: |
          rm -rf research/luna_m1_rsi_pivot_divergence_v2
          python scripts/research/luna_m1_rsi_pivot_divergence_v2.py             --input data/luna_daily/daily_prices.csv             --output research/luna_m1_rsi_pivot_divergence_v2             --k 20             --costs 20,40,60             --top-stage1 16

      - name: Validate
        run: |
          test -s research/luna_m1_rsi_pivot_divergence_v2/summary.json
          test -s research/luna_m1_rsi_pivot_divergence_v2/stage1_results.csv
          test -s research/luna_m1_rsi_pivot_divergence_v2/stage1_ranking.csv
          test -s research/luna_m1_rsi_pivot_divergence_v2/stage2_results.csv
          test -s research/luna_m1_rsi_pivot_divergence_v2/stage2_ranking.csv
          test -s research/luna_m1_rsi_pivot_divergence_v2/baselines.csv
          test -s research/luna_m1_rsi_pivot_divergence_v2/v1_proxy.csv
          python - <<'PY'
          import json
          x = json.load(open("research/luna_m1_rsi_pivot_divergence_v2/summary.json"))
          assert x["status"] == "COMPLETED"
          assert x["candidate_count_stage1"] == 864
          assert x["candidate_count_stage2"] >= 1000
          assert x["k"] == 20
          print(json.dumps(x, indent=2))
          PY

      - name: Save compact result
        run: |
          mkdir -p research-results
          cp research/luna_m1_rsi_pivot_divergence_v2/summary.json             research-results/luna-m1-rsi-pivot-divergence-v2-summary.json
          cp research/luna_m1_rsi_pivot_divergence_v2/stage1_results.csv             research-results/luna-m1-rsi-pivot-divergence-v2-stage1-results.csv
          cp research/luna_m1_rsi_pivot_divergence_v2/stage1_ranking.csv             research-results/luna-m1-rsi-pivot-divergence-v2-stage1-ranking.csv
          cp research/luna_m1_rsi_pivot_divergence_v2/stage2_results.csv             research-results/luna-m1-rsi-pivot-divergence-v2-stage2-results.csv
          cp research/luna_m1_rsi_pivot_divergence_v2/stage2_ranking.csv             research-results/luna-m1-rsi-pivot-divergence-v2-stage2-ranking.csv
          cp research/luna_m1_rsi_pivot_divergence_v2/baselines.csv             research-results/luna-m1-rsi-pivot-divergence-v2-baselines.csv
          cp research/luna_m1_rsi_pivot_divergence_v2/v1_proxy.csv             research-results/luna-m1-rsi-pivot-divergence-v2-v1-proxy.csv
          cp research/luna_m1_rsi_pivot_divergence_v2/stage1_catalog.json             research-results/luna-m1-rsi-pivot-divergence-v2-stage1-catalog.json
          cp research/luna_m1_rsi_pivot_divergence_v2/stage2_catalog.json             research-results/luna-m1-rsi-pivot-divergence-v2-stage2-catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save RSI pivot divergence v2 result"
          git pull --rebase origin master
          git push

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-m1-rsi-pivot-divergence-v2
          path: research/luna_m1_rsi_pivot_divergence_v2/
          retention-days: 14
