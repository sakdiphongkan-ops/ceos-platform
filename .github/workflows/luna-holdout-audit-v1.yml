name: LUNA Holdout Audit v1

on:
  workflow_dispatch:

concurrency:
  group: luna-holdout-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Block repeated holdout exposure
        run: |
          python scripts/research/guard_holdout_once.py --marker research-results/luna-holdout-audit-v1-sealed.json --result research-results/luna-holdout-audit-v1-summary.json --protocol LUNA-HOLDOUT-AUDIT-V1

        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -U pip pandas numpy python-dateutil requests

      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip

      - name: Normalize SET history
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025             --quarantine-invalid             --max-invalid-rate 0.01

      - name: Build daily factors
        run: |
          python scripts/research/build_factor_dataset.py             --prices data/set_2000_2025/prices.csv             --output data/set_2000_2025/factors.csv

      - name: Build monthly point-in-time factors
        run: |
          rm -rf data/luna_monthly
          mkdir -p data/luna_monthly
          python scripts/research/build_monthly_luna_factors_from_daily.py             --input data/set_2000_2025/factors.csv             --output data/luna_monthly/monthly_price_factors.csv             --lookback-years 5
          test -s data/luna_monthly/monthly_price_factors.csv

      - name: Run frozen holdout audit
        run: |
          rm -rf research/luna_holdout_audit_v1
          python scripts/research/luna_holdout_audit_v1.py             --input data/luna_monthly/monthly_price_factors.csv             --catalog research-results/luna-adaptive-tournament-v2/formula-catalog.json             --output research/luna_holdout_audit_v1             --holdout-months 12             --top-n 25             --cost-bps 20             --k 20

      - name: Validate
        run: |
          test -s research/luna_holdout_audit_v1/summary.json
          test -s research/luna_holdout_audit_v1/holdout_ranked.csv
          python - <<'PY'
          import json
          x=json.load(open("research/luna_holdout_audit_v1/summary.json"))
          assert x["holdout_months"] == 12
          assert x["top_n_frozen"] == 25
          assert x["selection_guard"]
          print(json.dumps(x,indent=2))
          PY

      - name: Commit audit result
        run: |
          mkdir -p research-results/luna-holdout-audit-v1
          cp research/luna_holdout_audit_v1/summary.json research-results/luna-holdout-audit-v1-summary.json
          cp research/luna_holdout_audit_v1/holdout_ranked.csv research-results/luna-holdout-audit-v1/holdout-ranked.csv
          cp data/luna_monthly/monthly_price_factors.manifest.json research-results/luna-holdout-audit-v1-monthly-data-manifest.json
          python scripts/research/guard_holdout_once.py --marker research-results/luna-holdout-audit-v1-sealed.json --result research-results/luna-holdout-audit-v1-summary.json --protocol LUNA-HOLDOUT-AUDIT-V1 --mode seal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save frozen holdout audit result"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-holdout-audit-v1-set
          path: research/luna_holdout_audit_v1/
          retention-days: 14
