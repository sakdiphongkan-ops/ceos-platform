name: LUNA Adaptive Tournament v3 Rerun
# Manual-only: research execution requires an explicitly verified PIT dataset/provenance.

on:
  workflow_dispatch:
    inputs:
      pit_membership_url:
        description: "PIT membership CSV URL"
        required: true
        type: string
      pit_membership_sha256:
        description: "SHA-256 of PIT membership CSV"
        required: true
        type: string
      pit_membership_manifest_url:
        description: "PIT membership provenance manifest JSON URL"
        required: true
        type: string
      pit_membership_manifest_sha256:
        description: "SHA-256 of PIT membership provenance manifest"
        required: true
        type: string
concurrency:
  group: luna-adaptive-tournament-v3-rerun
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify PIT membership provenance
        env:
          PIT_URL: ${{ inputs.pit_membership_url }}
          PIT_SHA: ${{ inputs.pit_membership_sha256 }}
          MANIFEST_URL: ${{ inputs.pit_membership_manifest_url }}
          MANIFEST_SHA: ${{ inputs.pit_membership_manifest_sha256 }}
        run: |
          mkdir -p data/raw/pit
          curl -fL --retry 3 --retry-delay 2 "$PIT_URL" -o data/raw/pit/pit_membership.csv
          curl -fL --retry 3 --retry-delay 2 "$MANIFEST_URL" -o data/raw/pit/pit_membership.manifest.json
          test "$(sha256sum data/raw/pit/pit_membership.csv | awk '{print $1}')" = "$PIT_SHA"
          test "$(sha256sum data/raw/pit/pit_membership.manifest.json | awk '{print $1}')" = "$MANIFEST_SHA"
          python scripts/research/verify_pit_membership_manifest.py             --membership data/raw/pit/pit_membership.csv             --manifest data/raw/pit/pit_membership.manifest.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -U pip pandas numpy python-dateutil
      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2 "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1" -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip
      - name: Normalize SET history
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py --zip data/raw/gybmm9t3mr-1.zip --output-dir data/set_2000_2025 --quarantine-invalid --max-invalid-rate 0.01
      - name: Build canonical daily factors
        run: |
          python scripts/research/build_factor_dataset.py --prices data/set_2000_2025/prices.csv --output data/set_2000_2025/factors.csv
      - name: Restrict to trailing five years
        run: |
          python scripts/research/filter_last_5y.py --input data/set_2000_2025/factors.csv --output data/set_2000_2025/factors_5y.csv
      - name: Build monthly panel
        run: |
          python scripts/research/build_monthly_factor_dataset.py --input data/set_2000_2025/factors_5y.csv --output data/set_2000_2025/monthly_factors_5y.csv --membership data/raw/pit/pit_membership.csv
          cat data/set_2000_2025/monthly_factors_5y.csv.manifest.json
      - name: Run 1000 formula tournament
        run: |
          rm -rf research/luna_adaptive_tournament_v3
          python scripts/research/luna_adaptive_tournament_v3.py --input data/set_2000_2025/monthly_factors_5y.csv --output research/luna_adaptive_tournament_v3 --formula-count 1000 --seed 20260920 --lookback-months 24 --min-history-months 12 --cost-bps 20 --k 20
      - name: Validate
        run: |
          test -s research/luna_adaptive_tournament_v3/summary.json
          test -s research/luna_adaptive_tournament_v3/tournament_selection_ledger.csv
          test -s research/luna_adaptive_tournament_v3/formula_catalog.json
          python - <<'PY'
          import json
          x=json.load(open("research/luna_adaptive_tournament_v3/summary.json"))
          assert x["status"] == "COMPLETED"
          assert x["formula_count"] == 1000
          assert x["months_traded"] >= 24
          assert x["leakage_guard"]
          assert x["benchmark_m1_rev21_k20"]
          print(json.dumps(x, indent=2))
          PY
      - name: Save results
        run: |
          mkdir -p research-results/luna-adaptive-tournament-v3-rerun
          cp research/luna_adaptive_tournament_v3/summary.json research-results/luna-adaptive-tournament-v3-rerun-summary.json
          cp research/luna_adaptive_tournament_v3/tournament_selection_ledger.csv research-results/luna-adaptive-tournament-v3-rerun/selection-ledger.csv
          cp research/luna_adaptive_tournament_v3/formula_catalog.json research-results/luna-adaptive-tournament-v3-rerun/formula-catalog.json
          cp research/luna_adaptive_tournament_v3/full_period_formula_stats.csv research-results/luna-adaptive-tournament-v3-rerun/full-period-formula-stats.csv
          cp data/set_2000_2025/monthly_factors_5y.csv.manifest.json research-results/luna-adaptive-tournament-v3-rerun-data-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save repaired public tournament v3 rerun"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-adaptive-tournament-v3-rerun
          path: research/luna_adaptive_tournament_v3/
          retention-days: 14
