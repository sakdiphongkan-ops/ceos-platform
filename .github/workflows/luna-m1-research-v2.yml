name: LUNA M1 Research v2

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_m1_research_v2.py"
      - ".github/workflows/luna-m1-research-v2.yml"
      - "scripts/research/build_factor_dataset.py"
      - "scripts/research/download_mendeley_set.py"
      - "scripts/research/filter_last_5y.py"
  workflow_dispatch:

concurrency:
  group: luna-m1-research-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy python-dateutil

      - name: Download historical SET dataset
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 --retry-delay 2             "https://data.mendeley.com/public-api/zip/gybmm9t3mr/download/1"             -o data/raw/gybmm9t3mr-1.zip
          test -s data/raw/gybmm9t3mr-1.zip

      - name: Normalize SET history
        run: |
          rm -rf data/set_2000_2025
          python scripts/research/download_mendeley_set.py             --zip data/raw/gybmm9t3mr-1.zip             --output-dir data/set_2000_2025             --quarantine-invalid             --max-invalid-rate 0.01

      - name: Build canonical price factors
        run: |
          python scripts/research/build_factor_dataset.py             --prices data/set_2000_2025/prices.csv             --output data/set_2000_2025/factors.csv             --feature-version luna-m1-research-v2

      - name: Restrict research window
        run: |
          python scripts/research/filter_last_5y.py             --input data/set_2000_2025/factors.csv             --output data/set_2000_2025/factors_5y.csv

      - name: Run theory-driven M1 research
        run: |
          rm -rf research/luna_m1_research_v2
          python scripts/research/luna_m1_research_v2.py             --input data/set_2000_2025/factors_5y.csv             --output research/luna_m1_research_v2             --costs 20,40,60             --top-dev 12

      - name: Validate research outputs
        run: |
          test -s research/luna_m1_research_v2/summary.json
          test -s research/luna_m1_research_v2/candidate_results.csv
          test -s research/luna_m1_research_v2/overlay_results.csv
          python - <<'PY'
          import json
          x=json.load(open("research/luna_m1_research_v2/summary.json"))
          assert x["status"] == "COMPLETED"
          assert x["candidate_count"] >= 50
          assert x["reference_cost_bps"] == 20
          print(json.dumps(x, indent=2))
          PY

      - name: Save compact result
        run: |
          mkdir -p research-results/luna-m1-research-v2
          cp research/luna_m1_research_v2/summary.json research-results/luna-m1-research-v2-summary.json
          cp research/luna_m1_research_v2/candidate_results.csv research-results/luna-m1-research-v2/candidate-results.csv
          cp research/luna_m1_research_v2/overlay_results.csv research-results/luna-m1-research-v2/overlay-results.csv
          cp research/luna_m1_research_v2/regime_series.csv research-results/luna-m1-research-v2/regime-series.csv
          cp research/luna_m1_research_v2/candidate_catalog.json research-results/luna-m1-research-v2/candidate-catalog.json

      - name: Commit compact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save M1 research v2 result"
          git push

      - name: Upload full research artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-m1-research-v2
          path: research/luna_m1_research_v2/
          retention-days: 14
