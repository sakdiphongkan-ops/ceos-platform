name: LUNA feasibility research CI

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_feasibility.py"
      - "scripts/research/test_luna_feasibility.py"
      - "scripts/research/luna_adaptive_tournament_v2.py"
      - "scripts/research/luna_cost_convention_audit.py"
      - "scripts/research/test_luna_cost_convention_audit.py"
      - "scripts/research/luna_m1_regime_selector_v1.py"
      - "scripts/research/test_luna_m1_regime_selector_v1.py"
      - "scripts/research/luna_m1_orthogonal_sizer_v1.py"
      - "scripts/research/test_luna_m1_orthogonal_sizer_v1.py"
      - "scripts/research/luna_m1_orthogonal_sizer_v2.py"
      - "scripts/research/test_luna_m1_orthogonal_sizer_v2.py"
      - ".github/workflows/luna-feasibility-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research runtime
        run: python -m pip install --upgrade pip numpy pandas
      - name: Compile research scripts
        run: python -m py_compile scripts/research/luna_feasibility.py scripts/research/luna_adaptive_tournament_v2.py scripts/research/luna_cost_convention_audit.py scripts/research/luna_m1_regime_selector_v1.py scripts/research/luna_m1_orthogonal_sizer_v1.py scripts/research/luna_m1_orthogonal_sizer_v2.py
      - name: Run research regression tests
        working-directory: scripts/research
        run: python -m unittest -v test_luna_feasibility.py test_luna_cost_convention_audit.py test_luna_m1_regime_selector_v1.py test_luna_m1_orthogonal_sizer_v1.py test_luna_m1_orthogonal_sizer_v2.py
