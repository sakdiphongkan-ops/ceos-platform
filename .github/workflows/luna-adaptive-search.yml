name: LUNA Adaptive Search v1

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/monthly_walk_forward_adaptive_search.py"
      - ".github/workflows/luna-adaptive-search.yml"
  workflow_dispatch:

concurrency:
  group: luna-adaptive-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Export completed monthly factor dataset
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          rm -rf data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py             --output data/luna_monthly/monthly_price_factors.csv             --start 2021-09-01             --end 2026-08-01

      - name: Run Adaptive Search v1
        run: |
          rm -rf research/luna_monthly_adaptive_v1
          python scripts/research/monthly_walk_forward_adaptive_search.py             --input data/luna_monthly/monthly_price_factors.csv             --output research/luna_monthly_adaptive_v1             --lookback-months 24             --min-history-months 12             --cost-bps 40             --k-values 5,10,20

      - name: Validate output
        run: |
          test -s research/luna_monthly_adaptive_v1/summary.json
          test -s research/luna_monthly_adaptive_v1/adaptive_selection_ledger.csv
          python - <<'PY'
          import json
          p="research/luna_monthly_adaptive_v1/summary.json"
          x=json.load(open(p))
          assert x["leakage_guard"]
          assert x["months_traded"] >= 40
          print(json.dumps(x, indent=2))
          PY

      - name: Save compact result
        run: |
          cp research/luna_monthly_adaptive_v1/summary.json             research-results/luna-monthly-adaptive-v1-result.json

      - name: Commit compact result and ledger
        run: |
          mkdir -p research-results/luna-monthly-adaptive-v1
          cp research/luna_monthly_adaptive_v1/adaptive_selection_ledger.csv             research-results/luna-monthly-adaptive-v1/selection-ledger.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-monthly-adaptive-v1-result.json             research-results/luna-monthly-adaptive-v1/selection-ledger.csv
          git diff --cached --quiet || git commit -m "Save LUNA adaptive search v1 result"
          git push

      - name: Upload full research artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-monthly-adaptive-v1-results
          path: |
            research/luna_monthly_adaptive_v1/summary.json
            research/luna_monthly_adaptive_v1/adaptive_selection_ledger.csv
          compression-level: 0
          retention-days: 14
