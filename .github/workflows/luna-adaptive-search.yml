name: LUNA Adaptive Search v1

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/monthly_walk_forward_adaptive_search.py"
      - "scripts/research/export_supabase_monthly_factors.py"
      - "scripts/research/apply_pit_universe.py"
      - "scripts/research/luna_formula_identity.py"
      - "scripts/research/luna_direct_supabase_1000_v1.py"
      - "tests/research/test_luna_formula_identity.py"
      - "tests/research/test_luna_monthly_return_guards.py"
      - "tests/research/test_luna_meta_ensemble_data_contract.py"
      - ".github/workflows/luna-adaptive-search.yml"
  workflow_dispatch:

concurrency:
  group: luna-adaptive-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run LUNA research regression guards
        run: |
          python tests/research/test_luna_formula_identity.py
          python tests/research/test_luna_monthly_return_guards.py
          python tests/research/test_luna_meta_ensemble_data_contract.py

      - name: Validate point-in-time membership input
        env:
          LUNA_PIT_UNIVERSE_MEMBERSHIP: ${{ vars.LUNA_PIT_UNIVERSE_MEMBERSHIP }}
        run: |
          if [ -z "$LUNA_PIT_UNIVERSE_MEMBERSHIP" ]; then
            echo "::error::Missing repository variable LUNA_PIT_UNIVERSE_MEMBERSHIP. Provide a versioned, source-verified historical membership CSV; do not substitute today's constituent list."
            exit 1
          fi
          if [ ! -f "$LUNA_PIT_UNIVERSE_MEMBERSHIP" ]; then
            echo "::error::PIT membership file does not exist at configured path: $LUNA_PIT_UNIVERSE_MEMBERSHIP"
            exit 1
          fi
          python - <<'PY'
          import os
          from scripts.research.apply_pit_universe import load_membership
          path = os.environ["LUNA_PIT_UNIVERSE_MEMBERSHIP"]
          rows = load_membership(path)
          print({"membership_rows": len(rows), "source_file": path})
          PY

      - name: Export completed monthly factor dataset
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          rm -rf data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py             --output data/luna_monthly/monthly_price_factors.csv             --start 2021-09-01             --end 2026-08-01

      - name: Run Adaptive Search v1
        env:
          LUNA_PIT_UNIVERSE_MEMBERSHIP: ${{ vars.LUNA_PIT_UNIVERSE_MEMBERSHIP }}
        run: |
          rm -rf research/luna_monthly_adaptive_v1
          python scripts/research/monthly_walk_forward_adaptive_search.py \
            --input data/luna_monthly/monthly_price_factors.csv \
            --output research/luna_monthly_adaptive_v1 \
            --membership "$LUNA_PIT_UNIVERSE_MEMBERSHIP" \
            --lookback-months 24 \
            --min-history-months 12 \
            --cost-bps 20 \
            --k-values 5,10,20

      - name: Validate output
        run: |
          test -s research/luna_monthly_adaptive_v1/summary.json
          test -s research/luna_monthly_adaptive_v1/adaptive_selection_ledger.csv
          test -s research/luna_monthly_adaptive_v1/candidate-catalog.v2.json
          python - <<'PY'
          import json
          p="research/luna_monthly_adaptive_v1/summary.json"
          x=json.load(open(p))
          catalog=json.load(open("research/luna_monthly_adaptive_v1/candidate-catalog.v2.json"))
          assert x["leakage_guard"]
          assert x["months_traded"] >= 40
          assert x["run_id"] == catalog["manifest"]["run_id"]
          assert x["formula_catalog_sha256"] == catalog["catalog_sha256"]
          ids=[f["formula_uid"] for f in catalog["formulas"]]
          assert len(ids) == len(set(ids)), "formula_uid collision inside one run"
          print(json.dumps(x, indent=2))
          PY

      - name: Save compact result
        run: |
          cp research/luna_monthly_adaptive_v1/summary.json             research-results/luna-monthly-adaptive-v1-result.json

      - name: Commit compact result and ledger
        run: |
          mkdir -p research-results/luna-monthly-adaptive-v1
          cp research/luna_monthly_adaptive_v1/adaptive_selection_ledger.csv             research-results/luna-monthly-adaptive-v1/selection-ledger.csv
          cp research/luna_monthly_adaptive_v1/candidate-catalog.v2.json             research-results/luna-monthly-adaptive-v1/candidate-catalog.v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-monthly-adaptive-v1-result.json             research-results/luna-monthly-adaptive-v1/selection-ledger.csv             research-results/luna-monthly-adaptive-v1/candidate-catalog.v2.json
          git diff --cached --quiet || git commit -m "Save LUNA adaptive search v1 result"
          git push

      - name: Upload full research artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-monthly-adaptive-v1-results
          path: |
            research/luna_monthly_adaptive_v1/summary.json
            research/luna_monthly_adaptive_v1/adaptive_selection_ledger.csv
            research/luna_monthly_adaptive_v1/candidate-catalog.v2.json
          compression-level: 0
          retention-days: 14
