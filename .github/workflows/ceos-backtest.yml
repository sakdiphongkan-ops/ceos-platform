name: CEOS Backtest
on:
  push:
    branches: [master]
    paths:
      - "scripts/ceos_backtest.py"
      - ".github/workflows/ceos-backtest.yml"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python scripts/ceos_backtest.py > ceos-backtest-result.json
      - run: |
          git config user.name "ceos-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ceos-backtest-result.json
          git commit -m "chore: update CEOS backtest result" || exit 0
          git push
