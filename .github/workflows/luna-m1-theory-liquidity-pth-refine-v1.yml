name: LUNA M1 Liquidity PTH Focused Refinement v1

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_m1_theory_liquidity_pth_refine_v1.py"
      - ".github/workflows/luna-m1-theory-liquidity-pth-refine-v1.yml"
      - "scripts/research/export_supabase_monthly_factors.py"
  workflow_dispatch:

concurrency:
  group: luna-m1-theory-liquidity-pth-refine-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Export factor panel
        env:
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py \
            --output data/luna_monthly/monthly_price_factors.csv \
            --start 2021-09-01 \
            --end 2026-08-31

      - name: Run focused refinement
        run: |
          rm -rf research/luna_m1_theory_liquidity_pth_refine_v1
          python scripts/research/luna_m1_theory_liquidity_pth_refine_v1.py \
            --input data/luna_monthly/monthly_price_factors.csv \
            --output research/luna_m1_theory_liquidity_pth_refine_v1 \
            --k 20 \
            --costs 20,40,60

      - name: Validate
        run: |
          test -s research/luna_m1_theory_liquidity_pth_refine_v1/summary.json
          test -s research/luna_m1_theory_liquidity_pth_refine_v1/candidate_results.csv
          test -s research/luna_m1_theory_liquidity_pth_refine_v1/robust_ranking.csv
          python - <<'PY'
          import json
          x=json.load(open("research/luna_m1_theory_liquidity_pth_refine_v1/summary.json"))
          assert x["status"] == "COMPLETED"
          assert x["candidate_count"] == 91
          assert x["k"] == 20
          assert "TRAIN+DEV" in x["selection"]
          print(json.dumps(x, indent=2))
          PY

      - name: Save result
        run: |
          mkdir -p research-results/luna-m1-theory-liquidity-pth-refine-v1
          cp research/luna_m1_theory_liquidity_pth_refine_v1/summary.json \
             research-results/luna-m1-theory-liquidity-pth-refine-v1-summary.json
          cp research/luna_m1_theory_liquidity_pth_refine_v1/candidate_results.csv \
             research-results/luna-m1-theory-liquidity-pth-refine-v1/candidate-results.csv
          cp research/luna_m1_theory_liquidity_pth_refine_v1/robust_ranking.csv \
             research-results/luna-m1-theory-liquidity-pth-refine-v1/robust-ranking.csv
          cp research/luna_m1_theory_liquidity_pth_refine_v1/candidate_catalog.json \
             research-results/luna-m1-theory-liquidity-pth-refine-v1/candidate-catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save focused liquidity PTH refinement result"
          git pull --rebase origin master
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-m1-theory-liquidity-pth-refine-v1
          path: research/luna_m1_theory_liquidity_pth_refine_v1/
          retention-days: 14
