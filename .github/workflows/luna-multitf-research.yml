name: LUNA multi-timeframe research
on:
  push:
    paths:
      - "scripts/research/multitf.mjs"
      - ".github/workflows/luna-multitf-research.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate and patch runner syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/research/multitf.mjs')
          s=p.read_text()
          s=s.replace('}),null,2));', '}),null,2));')
          s=s.replace('},null,2));', '},null,2));')
          p.write_text(s)
          PY
          node --check scripts/research/multitf.mjs
      - name: Run research
        run: node scripts/research/multitf.mjs > multitf-result.json && cat multitf-result.json
      - name: Save result into repository
        run: |
          mkdir -p research-results
          cp multitf-result.json research-results/multitf-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/multitf-result.json
          git diff --cached --quiet || git commit -m "Save LUNA multi-timeframe research result"
          git push
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: luna-multitf-result
          path: multitf-result.json
