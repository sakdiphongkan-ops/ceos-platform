name: LUNA TradingView Indicator + Strategy Tournament v1

on:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_tradingview_indicator_engine_v1.py"
      - "scripts/research/luna_tradingview_strategy_tournament_v1.py"
      - ".github/workflows/luna-tradingview-indicator-tournament-v1.yml"
  workflow_dispatch:

concurrency:
  group: luna-tradingview-indicator-tournament-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests

      - name: Export daily SET prices
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import pandas as pd

          url = "https://wigzicwgcsrhdummrbjx.supabase.co/functions/v1/luna-research-export-v1"
          workers = 4

          months = pd.date_range("2021-09-01", "2026-08-01", freq="MS")

          def fetch_month(start):
              start_s = start.strftime("%Y-%m-%d")
              end_s = (start + pd.offsets.MonthEnd(1)).strftime("%Y-%m-%d")
              last = None
              for attempt in range(5):
                  try:
                      r = requests.get(
                          url,
                          params={"scope": "luna5y", "start": start_s, "end": end_s},
                          timeout=180,
                      )
                      if r.status_code >= 500:
                          last = RuntimeError(f"server {r.status_code}: {r.text[:200]}")
                          continue
                      r.raise_for_status()
                      payload = r.json()
                      return start_s, payload.get("data", [])
                  except Exception as exc:
                      last = exc
              raise last

          rows = []
          with ThreadPoolExecutor(max_workers=workers) as ex:
              futs = [ex.submit(fetch_month, m) for m in months]
              for fut in as_completed(futs):
                  month, month_rows = fut.result()
                  rows.extend(month_rows)
                  print(f"completed_month={month} rows={len(month_rows)} total={len(rows)}", flush=True)

          out = Path("data/luna_daily/daily_prices.csv")
          out.parent.mkdir(parents=True, exist_ok=True)
          df = pd.DataFrame(rows, columns=["date","symbol","market","open","high","low","close","adj_close","volume","amount","available_at"])
          df["date"] = pd.to_datetime(df["date"])
          for c in ["open","high","low","close","adj_close","volume","amount"]:
              df[c] = pd.to_numeric(df[c], errors="coerce")
          df["available_at"] = pd.to_datetime(df["available_at"], utc=True, errors="coerce")
          df = df[(df["date"] >= "2021-09-01") & (df["date"] <= "2026-08-31")].copy()
          df = df.sort_values(["symbol","date"]).drop_duplicates(["symbol","date"])
          df.to_csv(out, index=False)
          summary = {"rows": len(df), "symbols": df["symbol"].nunique(), "start": str(df["date"].min().date()), "end": str(df["date"].max().date())}
          print(summary)
          assert summary["symbols"] == 924, summary
          assert summary["rows"] > 1000000, summary
          assert summary["start"] == "2021-09-20", summary
          assert summary["end"] in {"2026-08-29","2026-08-31"}, summary
          PY

      - name: Build TradingView-derived indicator panel
        run: |
          rm -rf research/luna_tradingview_indicator_engine_v1
          python scripts/research/luna_tradingview_indicator_engine_v1.py \
            --input data/luna_daily/daily_prices.csv \
            --output research/luna_tradingview_indicator_engine_v1

      - name: Run M1 x TradingView strategy tournament
        run: |
          rm -rf research/luna_tradingview_strategy_tournament_v1
          python scripts/research/luna_tradingview_strategy_tournament_v1.py \
            --input research/luna_tradingview_indicator_engine_v1/monthly_indicator_panel.csv \
            --output research/luna_tradingview_strategy_tournament_v1 \
            --costs 20,40,60

      - name: Validate
        run: |
          test -s research/luna_tradingview_indicator_engine_v1/summary.json
          test -s research/luna_tradingview_indicator_engine_v1/monthly_indicator_panel.csv
          test -s research/luna_tradingview_strategy_tournament_v1/summary.json
          test -s research/luna_tradingview_strategy_tournament_v1/candidate_results.csv
          test -s research/luna_tradingview_strategy_tournament_v1/robust_ranking.csv
          python - <<'PY'
          import json
          x=json.load(open("research/luna_tradingview_strategy_tournament_v1/summary.json"))
          assert x["status"]=="COMPLETED"
          assert x["candidate_count"] >= 30
          assert x["train_dev_only_selection"] is True
          assert x["frozen_periods"] == ["OOS","HOLDOUT"]
          print(json.dumps(x,indent=2))
          PY

      - name: Publish audit summary to GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          p=Path("research/luna_tradingview_strategy_tournament_v1/candidate_results.csv")
          x=pd.read_csv(p)
          ref=x[(x["candidate"]=="BASELINE")&(x["bps"]==20)].iloc[0]
          rows=x[x["bps"]==20].copy()

          rows["d_FULL5Y_geo"]=rows["FULL5Y_geo_monthly"]-ref["FULL5Y_geo_monthly"]
          rows["d_OOS_geo"]=rows["OOS_geo_monthly"]-ref["OOS_geo_monthly"]
          rows["d_HO_geo"]=rows["HOLDOUT_geo_monthly"]-ref["HOLDOUT_geo_monthly"]

          strict=rows[
              (rows["candidate"]!="BASELINE")&
              (rows["FULL5Y_geo_monthly"]>ref["FULL5Y_geo_monthly"])&
              (rows["OOS_geo_monthly"]>ref["OOS_geo_monthly"])&
              (rows["HOLDOUT_geo_monthly"]>ref["HOLDOUT_geo_monthly"])&
              (rows["OOS_max_drawdown_pct"]>=ref["OOS_max_drawdown_pct"])&
              (rows["HOLDOUT_max_drawdown_pct"]>=ref["HOLDOUT_max_drawdown_pct"])&
              (rows["OOS_positive_month_pct"]>=ref["OOS_positive_month_pct"])&
              (rows["HOLDOUT_positive_month_pct"]>=ref["HOLDOUT_positive_month_pct"])
          ]["candidate"].tolist()

          stress=x[(x["bps"].isin([40,60])) & (x["candidate"].isin(strict))]
          stress_ok=(
              stress.groupby("candidate")
              .apply(lambda g: (g["OOS_geo_monthly"]>0).all() and (g["HOLDOUT_geo_monthly"]>0).all(),
                     include_groups=False)
              .to_dict()
          )
          strict=[c for c in strict if stress_ok.get(c,False)]

          top=rows.sort_values(["d_HO_geo","d_OOS_geo"],ascending=False).head(15)
          lines=[]
          lines.append("# LUNA TradingView 35-formula tournament — latest audit")
          lines.append("")
          lines.append("Control: locked M1_S0_K20_REV at 20bps round-trip.")
          lines.append("FULL5Y: 2021-10-31 to 2026-08-31. OOS: 2024-09-30 to 2025-08-31. HOLDOUT: 2025-09-30 to 2026-08-31.")
          lines.append("")
          lines.append("## Locked M1 @20bps")
          lines.append(f"- FULL5Y geo/month: {ref['FULL5Y_geo_monthly']:.4%}; cumulative: {ref['FULL5Y_cumulative']:.2%}; max DD: {ref['FULL5Y_max_drawdown_pct']:.2%}; positive months: {ref['FULL5Y_positive_month_pct']:.1%}")
          lines.append(f"- OOS geo/month: {ref['OOS_geo_monthly']:.4%}; max DD: {ref['OOS_max_drawdown_pct']:.2%}; positive months: {ref['OOS_positive_month_pct']:.1%}")
          lines.append(f"- HOLDOUT geo/month: {ref['HOLDOUT_geo_monthly']:.4%}; max DD: {ref['HOLDOUT_max_drawdown_pct']:.2%}; positive months: {ref['HOLDOUT_positive_month_pct']:.1%}")
          lines.append("")
          lines.append(f"## Strict survivors after 20/40/60bps stress: {len(strict)}")
          lines.append(", ".join(strict) if strict else "None")
          lines.append("")
          lines.append("## Top 15 by HOLDOUT/OOS delta vs M1 @20bps")
          lines.append("| Candidate | FULL5Y geo | d5Y | OOS geo | dOOS | OOS DD | HOLDOUT geo | dHO | HO DD |")
          lines.append("|---|---:|---:|---:|---:|---:|---:|---:|---:|")
          for _,r0 in top.iterrows():
              lines.append(
                  f"| {r0['candidate']} | {r0['FULL5Y_geo_monthly']:.3%} | {r0['d_FULL5Y_geo']:+.3%} | "
                  f"{r0['OOS_geo_monthly']:.3%} | {r0['d_OOS_geo']:+.3%} | {r0['OOS_max_drawdown_pct']:.2%} | "
                  f"{r0['HOLDOUT_geo_monthly']:.3%} | {r0['d_HO_geo']:+.3%} | {r0['HOLDOUT_max_drawdown_pct']:.2%} |"
              )
          lines.append("")
          lines.append("Machine-readable full candidate results are stored by the workflow.")
          Path("research-results-comment.md").write_text("\\n".join(lines),encoding="utf-8")
          PY
          gh issue comment 2 --body-file research-results-comment.md

      - name: Persist tournament results via GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          import urllib.request
          import urllib.error

          root=Path("research/luna_tradingview_strategy_tournament_v1")
          files={
            "research-results/luna-tradingview-v1/strategy-tournament-summary.json":
              (root/"summary.json").read_bytes(),
            "research-results/luna-tradingview-v1/candidate-results.csv":
              (root/"candidate_results.csv").read_bytes(),
            "research-results/luna-tradingview-v1/robust-ranking.csv":
              (root/"robust_ranking.csv").read_bytes(),
            "research-results/luna-tradingview-v1/candidate-catalog.json":
              (root/"candidate_catalog.json").read_bytes(),
          }
          for path,data in files.items():
            api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}"
            headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json",
              "User-Agent":"luna-actions"
            }
            sha=None
            try:
              req=urllib.request.Request(api,headers=headers)
              with urllib.request.urlopen(req) as resp:
                sha=json.load(resp)["sha"]
            except urllib.error.HTTPError as e:
              if e.code != 404:
                raise
            payload={
              "message":"research(luna): persist TradingView tournament result",
              "content":base64.b64encode(data).decode(),
              "branch":"master"
            }
            if sha:
              payload["sha"]=sha
            req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers=headers,method="PUT")
            with urllib.request.urlopen(req) as resp:
              print(path, resp.status)
          PY

      - name: Save compact research results
        run: |
          mkdir -p research-results/luna-tradingview-v1
          cp research/luna_tradingview_indicator_engine_v1/summary.json \
             research-results/luna-tradingview-v1/indicator-engine-summary.json
          cp research/luna_tradingview_indicator_engine_v1/monthly_indicator_panel.csv \
             research-results/luna-tradingview-v1/monthly-indicator-panel.csv
          cp research/luna_tradingview_strategy_tournament_v1/summary.json \
             research-results/luna-tradingview-v1/strategy-tournament-summary.json
          cp research/luna_tradingview_strategy_tournament_v1/candidate_results.csv \
             research-results/luna-tradingview-v1/candidate-results.csv
          cp research/luna_tradingview_strategy_tournament_v1/robust_ranking.csv \
             research-results/luna-tradingview-v1/robust-ranking.csv
          cp research/luna_tradingview_strategy_tournament_v1/candidate_catalog.json \
             research-results/luna-tradingview-v1/candidate-catalog.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/luna-tradingview-v1/
          git diff --cached --quiet || git commit -m "research(luna): save TradingView indicator tournament results"
          git pull --rebase origin master
          git push

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-tradingview-indicator-tournament-v1
          path: |
            research/luna_tradingview_indicator_engine_v1/
            research/luna_tradingview_strategy_tournament_v1/
          retention-days: 14
