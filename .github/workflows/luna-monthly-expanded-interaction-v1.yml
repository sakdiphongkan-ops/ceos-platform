name: LUNA Monthly Expanded Interaction Search v1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/research/luna_monthly_expanded_interaction_v1.py"
      - ".github/workflows/luna-monthly-expanded-interaction-v1.yml"

concurrency:
  group: luna-monthly-expanded-interaction-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://wigzicwgcsrhdummrbjx.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -U pip pandas numpy requests
      - name: Export monthly factor data
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p data/luna_monthly
          python scripts/research/export_supabase_monthly_factors.py             --output data/luna_monthly/monthly_price_factors.csv             --start 2021-09-01 --end 2026-09-01
      - name: Run 10000-formula expanded search
        run: |
          rm -rf research/luna_monthly_expanded_interaction_v1
          python scripts/research/luna_monthly_expanded_interaction_v1.py             --input data/luna_monthly/monthly_price_factors.csv             --output research/luna_monthly_expanded_interaction_v1             --formula-count 10000             --finalists 200             --development-fraction 0.65             --holdout-months 12             --cost-bps 20             --k 20             --seed 20260921
      - name: Validate
        run: |
          test -s research/luna_monthly_expanded_interaction_v1/summary.json
          test -s research/luna_monthly_expanded_interaction_v1/finalist_monthly_returns.csv
      - name: Save compact result
        run: |
          mkdir -p research-results/luna-monthly-expanded-interaction-v1
          cp research/luna_monthly_expanded_interaction_v1/summary.json              research-results/luna-monthly-expanded-interaction-v1-result.json
          cp research/luna_monthly_expanded_interaction_v1/finalist_monthly_returns.csv              research-results/luna-monthly-expanded-interaction-v1/finalist-monthly-returns.csv
          cp research/luna_monthly_expanded_interaction_v1/formula_catalog.json              research-results/luna-monthly-expanded-interaction-v1/formula-catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/
          git diff --cached --quiet || git commit -m "research(luna): save expanded interaction search result"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-monthly-expanded-interaction-v1
          path: research/luna_monthly_expanded_interaction_v1/
          retention-days: 14
