name: LUNA research and execution hardening

on:
  push:
    branches: [master]
    paths:
      - "luna-th1h/**"
      - "scripts/research/**"
      - "Dockerfile.luna"
      - ".github/workflows/luna-research-hardening.yml"
  pull_request:
    branches: [master]
    paths:
      - "luna-th1h/**"
      - "scripts/research/**"
      - "Dockerfile.luna"
      - ".github/workflows/luna-research-hardening.yml"

permissions:
  contents: read

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: luna-th1h
        run: npm install

      - name: Typecheck / build
        working-directory: luna-th1h
        run: npm run build

      - name: Research monthly metric regression
        working-directory: luna-th1h
        run: npm run test:research-monthly-stats

      - name: Research governance regression
        working-directory: luna-th1h
        run: npm run test:research-governance

      - name: Execution cost and L2 replay regression
        working-directory: luna-th1h
        run: npm run test:cost-replay

      - name: Execution risk guards
        working-directory: luna-th1h
        run: npm run test:risk-guards

      - name: Strategy state regression
        working-directory: luna-th1h
        run: npm run test:strategy-state

      - name: PIT universe regression
        working-directory: luna-th1h
        run: npm run test:pit-universe

  python-research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile research tooling
        run: |
          python -m py_compile             scripts/research/normalize_set_tick_data.py             scripts/research/qa_verified_15m.py             scripts/research/apply_pit_universe.py             scripts/research/test_apply_pit_universe.py             scripts/research/test_set_data_contract.py             scripts/research/monthly_walk_forward_adaptive_search.py             scripts/research/luna_adaptive_tournament_v2.py             scripts/research/build_monthly_factor_dataset.py             scripts/research/luna_adaptive_tournament_v3.py

      - name: Data normalization contract
        run: python scripts/research/test_set_data_contract.py
