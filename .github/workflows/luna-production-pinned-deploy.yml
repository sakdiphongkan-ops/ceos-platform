name: LUNA production pinned deploy

on:
  push:
    branches: [master]
    paths:
      - 'luna-th1h/**'
      - 'luna-execution-gateway/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY for a manual pinned production deploy"
        required: true
        type: string


permissions:
  contents: read
  checks: read

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[LUNA-PROD-DEPLOY]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify manual confirmation when dispatching
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "${{ inputs.confirm }}" = "DEPLOY"
      - name: Verify Railway deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: test -n "$RAILWAY_TOKEN"

      - name: Verify source revision
        run: |
          echo "Deploying commit: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Wait for all required CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            rows=$(gh api repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs --paginate --jq '.check_runs[] | [.name,.status,.conclusion] | @tsv' || true)
            echo "$rows"
            gateway=$(printf '%s\n' "$rows" | awk -F '\t' '$1=="gateway-ci"{print $2" "$3; exit}')
            typecheck=$(printf '%s\n' "$rows" | awk -F '\t' '$1=="typecheck"{print $2" "$3; exit}')
            build=$(printf '%s\n' "$rows" | awk -F '\t' '$1=="build"{print $2" "$3; exit}')
            execution=$(printf '%s\n' "$rows" | awk -F '\t' '$1=="execution-gate"{print $2" "$3; exit}')

            gateway_ok=$(printf '%s' "$gateway" | grep -q '^completed success$' && echo yes || echo no)
            typecheck_ok=$(printf '%s' "$typecheck" | grep -q '^completed success$' && echo yes || echo no)
            build_ok=$(printf '%s' "$build" | grep -q '^completed success$' && echo yes || echo no)
            execution_ok=$(printf '%s' "$execution" | grep -q '^completed success$' && echo yes || echo no)

            typecheck_required=$([ -n "$typecheck" ] && echo yes || echo no)
            build_required=$([ -n "$build" ] && echo yes || echo no)
            execution_required=$([ -n "$execution" ] && echo yes || echo no)

            if [ "$gateway_ok" = yes ] \
              && { [ "$typecheck_required" = no ] || [ "$typecheck_ok" = yes ]; } \
              && { [ "$build_required" = no ] || [ "$build_ok" = yes ]; } \
              && { [ "$execution_required" = no ] || [ "$execution_ok" = yes ]; }; then
              echo "Required LUNA CI passed for $GITHUB_SHA"
              break
            fi

            if printf '%s' "$gateway" | grep -q 'completed failure\|completed cancelled\|completed timed_out'; then
              echo "Gateway CI failed on $GITHUB_SHA"
              exit 1
            fi
            if printf '%s' "$typecheck" | grep -q 'completed failure\|completed cancelled\|completed timed_out'; then
              echo "LUNA typecheck failed on $GITHUB_SHA"
              exit 1
            fi
            if printf '%s' "$build" | grep -q 'completed failure\|completed cancelled\|completed timed_out'; then
              echo "CEOS build failed on $GITHUB_SHA"
              exit 1
            fi
            if printf '%s' "$execution" | grep -q 'completed failure\|completed cancelled\|completed timed_out'; then
              echo "Execution gate failed on $GITHUB_SHA"
              exit 1
            fi

            if [ $(date +%s) -ge $deadline ]; then
              echo "Timed out waiting for all required CI"
              exit 1
            fi
            sleep 15
          done
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Pin source revision guards without intermediate deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WORKER_ID: "213d7bc4-8734-40ec-a419-6931f9c63573"
          GATEWAY_ID: "222fea4d-3900-49ac-b375-92e522d15ffa"
          ENV_ID: "a0a04144-e4d8-4352-a578-27ef8fb56e5c"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for SERVICE_ID in "$WORKER_ID" "$GATEWAY_ID"; do
            railway variable set -s "$SERVICE_ID" -e "$ENV_ID" --skip-deploys LUNA_DEPLOY_SOURCE_SHA="$COMMIT_SHA" LUNA_EXPECTED_SOURCE_SHA="$COMMIT_SHA"
          done
      - name: Deploy worker exact checked-out source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: "213d7bc4-8734-40ec-a419-6931f9c63573"
          ENV_ID: "a0a04144-e4d8-4352-a578-27ef8fb56e5c"
          PROJECT_ID: "26e44379-04ed-4132-b1d8-fbde42a45d9a"
        run: |
          railway up --project "$PROJECT_ID" --environment "$ENV_ID" --service "$SERVICE_ID" --ci --message "LUNA worker pinned deploy $GITHUB_SHA"
      - name: Deploy gateway exact checked-out source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: "222fea4d-3900-49ac-b375-92e522d15ffa"
          ENV_ID: "a0a04144-e4d8-4352-a578-27ef8fb56e5c"
          PROJECT_ID: "26e44379-04ed-4132-b1d8-fbde42a45d9a"
        run: |
          cd luna-execution-gateway
          railway up --project "$PROJECT_ID" --environment "$ENV_ID" --service "$SERVICE_ID" --ci --message "LUNA gateway pinned deploy $GITHUB_SHA"
      - name: Verify latest worker deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: "213d7bc4-8734-40ec-a419-6931f9c63573"
          ENV_ID: "a0a04144-e4d8-4352-a578-27ef8fb56e5c"
        run: |
          railway deployment list --service "$SERVICE_ID" --environment "$ENV_ID" --limit 1 --json | tee worker-deployment.json
          python - <<'PY'
          import json
          d=json.load(open('worker-deployment.json'))[0]
          print(d)
          assert d.get('status') == 'SUCCESS', d
          PY
          railway service logs --service "$SERVICE_ID" --environment "$ENV_ID" --latest -n 250 | tee worker.log
          grep -F 'LUNA_BOOT' worker.log | tail -n 20
          grep -F "sourceRevision=$GITHUB_SHA" worker.log
      - name: Verify latest gateway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: "222fea4d-3900-49ac-b375-92e522d15ffa"
          ENV_ID: "a0a04144-e4d8-4352-a578-27ef8fb56e5c"
        run: |
          railway deployment list --service "$SERVICE_ID" --environment "$ENV_ID" --limit 1 --json | tee gateway-deployment.json
          python - <<'PY'
          import json
          d=json.load(open('gateway-deployment.json'))[0]
          print(d)
          assert d.get('status') == 'SUCCESS', d
          PY
          railway service logs --service "$SERVICE_ID" --environment "$ENV_ID" --latest -n 250 | tee gateway.log
          grep -F "LUNA_GATEWAY_SOURCE_REVISION revision=$GITHUB_SHA" gateway.log